name: CI

on:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-format:
    name: Swift Format
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v7
      - name: Validate latest Codex review policy
        uses: thatfactory/agent-guidelines/.github/actions/codex-review-policy@1c957669005eea010131c53f0a4146db2ccf7859
        with:
          profile: full
      - name: Log Active Toolchain
        run: |
          echo "Developer directory: ${DEVELOPER_DIR:-$(xcode-select -p)}"
          xcodebuild -version
          xcrun swiftc --version
      - name: Validate Consumer Integration
        run: AgentGuidelines/Scripts/validate_consumer_setup.swift
      - name: Strict Swift Format
        run: AgentGuidelines/Scripts/swift_format.sh lint-strict Package.swift Sources Tests

  validation:
    name: Tests, Platforms, and DocC
    runs-on: [self-hosted, macOS, ARM64]
    needs: swift-format
    steps:
      - uses: actions/checkout@v7
      - name: Log Active Toolchain
        run: |
          echo "Developer directory: ${DEVELOPER_DIR:-$(xcode-select -p)}"
          xcodebuild -version
          xcrun swiftc --version
      - name: Resolve Locked Dependencies
        run: |
          swift package resolve
          git diff --exit-code -- Package.resolved
      - name: Test
        run: swift test
      - name: Release Build
        run: swift build -c release
      - name: Compile Apple Platforms
        run: |
          set -euo pipefail
          for platform in iOS tvOS watchOS visionOS; do
            xcodebuild -scheme IIIFResolver -configuration Release \
              -destination "generic/platform=$platform" \
              -derivedDataPath .build/platforms build CODE_SIGNING_ALLOWED=NO
          done
      - name: Build DocC
        run: |
          swift package --allow-writing-to-directory .build/documentation generate-documentation \
            --target IIIFResolver --disable-indexing --output-path .build/documentation \
            --transform-for-static-hosting --hosting-base-path iiifresolver
      - name: Check Tracked Files
        run: git diff --exit-code
